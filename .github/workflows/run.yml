name: Market Anomaly Alert Bot

on:
  # 1. Cronjobs(外部サービス)やGitHub画面からの呼び出しを許可
  workflow_dispatch:

  # 2. 予備設定：Cronjobs側に遅延や停止が発生した際のGitHub自動バックアップ
  schedule:
    # JST 朝 08:00 (UTC 23:00前日)
    - cron: '0 23 * * *'
    
    # JST 夕方市況巡回 (15:30, 16:00, 16:30, 17:00, 17:30, 18:00) -> 平日UTC 06:30〜09:00
    - cron: '30 6 * * 1-5'
    - cron: '0 7 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '0 8 * * 1-5'
    - cron: '30 8 * * 1-5'
    - cron: '0 9 * * 1-5'
    
    # JST 夜 21:00 (UTC 12:00)
    - cron: '0 12 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Python Script
        env:
          # ★ サーバー環境を厳密に日本時間(JST)へ固定
          TZ: 'Asia/Tokyo'
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python main.py
