name: Daily Market Alert

on:
  schedule:
    # 平日朝 08:23 JST (UTC 前日23:23) -> 日〜木に実行（月〜金朝対応）
    - cron: '23 23 * * 0,1,2,3,4'
    # 平日夜 20:38 JST (UTC 当日11:38) -> 月〜金夜に実行
    - cron: '38 11 * * 1-5'
    # 日曜夜 20:38 JST (UTC 当日11:38) -> 日曜夜に実行
    - cron: '38 11 * * 0'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4

      - name: Run script
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
