name: Run Daily Alert Bot

on:
  schedule:
    # 日本時間 20:00 ( JST ) に実行
    # UTC時間 11:00 ( 0=日, 1=月, 2=火, 3=水, 4=木, 6=土 )
    # ※土曜日(UTC金曜)を除外し、日〜木(UTC)＝月〜金・日(JST) に実行
    - cron: '0 11 * * 0-4,6'
  workflow_dispatch: # 手動実行ボタン

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          pip install requests beautifulsoup4

      - name: プログラムを実行
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TZ: 'Asia/Tokyo'  # 時間帯を日本時間に固定
        run: python main.py
