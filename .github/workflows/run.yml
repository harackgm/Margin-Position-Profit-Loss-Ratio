name: Daily Market Alert

on:
  schedule:
    # Weekday Morning 08:30 JST (UTC 23:30)
    - cron: '30 23 * * 0-4'
    # Weekday Evening 21:30 JST (UTC 12:30)
    - cron: '30 12 * * 1-5'
    # Sunday Evening 20:00 JST (UTC 11:00)
    - cron: '0 11 * * 0'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4

      - name: Run script
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
