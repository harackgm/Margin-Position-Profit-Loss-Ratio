name: Run Daily Alert Bot

on:
  schedule:
    # 1) 朝 8:30 JST ( UTC 前日 23:30 ) : 平日（月〜金）の信用評価損益率アラートチェック
    - cron: '30 23 * * 0-4'

    # 2) 夜 20:00 JST ( UTC 11:00 ) : 日曜日の週末定期報告
    - cron: '0 11 * * 0'

    # 3) 夜 21:30 JST ( UTC 12:30 ) : 平日（月〜金）の米国重要指標チェック
    - cron: '30 12 * * 1-5'

  workflow_dispatch: # 手動実行ボタン

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          pip install requests beautifulsoup4 selenium

      - name: プログラムを実行
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TZ: 'Asia/Tokyo'  # 時間帯を日本時間に固定
        run: python main.py
