name: Daily Market Alert

on:
  schedule:
    # 平日朝 08:23 JST (UTC 前日23:23)
    - cron: '23 23 * * 0,1,2,3,4'
    # ★テスト用: 本日 11:11 JST (UTC 当日 02:11)
    - cron: '11 2 * * 1,2,3,4,5'
    # 日曜夜 19:52 JST (UTC 当日10:52)
    - cron: '52 10 * * 0,7'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4

      - name: Run script
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
        run: python main.py
