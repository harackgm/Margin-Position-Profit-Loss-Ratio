name: Market Anomaly Alert Bot

on:
  # Cronjobs（外部通信）およびGitHub画面からの呼び出しのみ許可（二重起動防止）
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Pythonスクリプトの実行
        env:
          # ★ サーバー環境を日本時間(JST)へ厳密固定
          TZ: 'Asia/Tokyo'
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python main.py
