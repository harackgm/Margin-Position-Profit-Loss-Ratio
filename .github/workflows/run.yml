name: Daily Market Alert

on:
  schedule:
    # 平日朝 08:23 JST (UTC 23:23)
    - cron: '23 23 * * 0-4'
    # 平日夜 19:51 JST (UTC 10:51)
    - cron: '51 10 * * 1-5'
    # 日曜夜 19:52 JST (UTC 10:52)
    - cron: '52 10 * * 0'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4

      - name: Run script
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
        run: python main.py
